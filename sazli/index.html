<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify – Song</title>
  <meta name="description" content="Listen on Spotify" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#121212" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #121212;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .cover {
      width: 220px;
      height: 220px;
      margin: 0 auto 22px;
      border-radius: 12px;
      background: linear-gradient(145deg, #1db954 0%, #191414 55%, #535353 100%);
      box-shadow: 0 16px 40px rgba(0,0,0,.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
    }
    .logo {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #1db954;
      margin-bottom: 18px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    .artist {
      color: #b3b3b3;
      font-size: 0.98rem;
      margin-bottom: 28px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 999px;
      background: #1db954;
      color: #000;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn.secondary {
      background: transparent;
      color: #fff;
      border: 1px solid #535353;
      font-weight: 600;
    }
    .meta {
      margin-top: 28px;
      font-size: 0.75rem;
      color: #6a6a6a;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Spotify</div>
    <div class="cover">🎵</div>
    <h1>Late Night Drive</h1>
    <p class="artist">Playlist · Various Artists</p>
    <a class="btn" href="https://open.spotify.com" target="_blank" rel="noopener">Play on Spotify</a>
    <a class="btn secondary" href="https://open.spotify.com" target="_blank" rel="noopener">Open app</a>
    <p class="meta">Preview only · Link opens Spotify</p>
  </div>
</body>
</html>
