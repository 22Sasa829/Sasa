<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sazy – Unlock</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    :root {
      --bg: #120e14;
      --card: #1f1724;
      --text: #fff5f8;
      --muted: #c9a8b8;
      --accent: #ff6b9d;
      --accent-soft: #ff8fb3;
      --border: rgba(255, 150, 180, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(255, 107, 157, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(255, 140, 180, 0.08) 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
    }

    .emoji {
      font-size: 2.4rem;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(120deg, #fff 30%, #ffb6c9 70%, #ff8fb3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .turnstile-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      min-height: 65px;
    }

    .status {
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 24px;
    }

    .status.success {
      color: #7dffb3;
    }

    .status.error {
      color: #ff6b9d;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
      opacity: 0.7;
    }

    .back:hover {
      opacity: 1;
      color: var(--accent-soft);
    }

    /* Success state */
    .success-view {
      display: none;
    }

    .success-view .check {
      font-size: 2.6rem;
      margin-bottom: 12px;
    }

    .success-view h1 {
      margin-bottom: 6px;
    }

    .success-view p {
      margin-bottom: 8px;
    }

    .verified-label {
      color: #7dffb3;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 22px;
    }

    .of-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 22px;
      border-radius: 999px;
      background: linear-gradient(145deg, #ff8fb3, #ff6b9d);
      border: none;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 28px rgba(255, 107, 157, 0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .of-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(255, 107, 157, 0.55);
    }

    .of-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card" id="main-card">

    <!-- ===== CHECK VIEW ===== -->
    <div id="check-view">
      <div class="emoji">🩵</div>
      <h1>Just a quick check</h1>
      <p>Confirm you’re human to unlock more of me ;)</p>

      <div class="turnstile-wrap">
        <div
          class="cf-turnstile"
          data-sitekey="0x4AAAAAAFRUcY06Vr6YD3bH"
          data-callback="onSuccess"
          data-error-callback="onError"
          data-theme="dark"
          data-size="normal"
        ></div>
      </div>

      <div class="status" id="status"></div>
      <a href="/" class="back">← zurück</a>
    </div>

    <!-- ===== SUCCESS VIEW ===== -->
    <div id="success-view" class="success-view">
      <div class="check">✅</div>
      <h1>You're in!</h1>
      <p>Tap the button below to continue</p>
      <div class="verified-label">Verified ✓</div>

      <a
        id="of-button"
        href="https://onlyfans.com/sazera/trial/ojmccj0sxdscd84nbs4ynwidzlxslwfz"
        class="of-btn"
        target="_blank"
        rel="noopener noreferrer"
      >
        Continue to OnlyFans 🔥
      </a>

      <a href="/" class="back">← zurück</a>
    </div>

  </div>

  <script>
    // OnlyFans Trial Link – hier kannst du ihn später ändern
    const OF_LINK = "https://onlyfans.com/sazera/trial/ojmccj0sxdscd84nbs4ynwidzlxslwfz";

    function onSuccess(token) {
      // Wechsle zur Success-Ansicht
      document.getElementById("check-view").style.display = "none";
      document.getElementById("success-view").style.display = "block";

      // Button-Link aktualisieren (falls sich OF_LINK ändert)
      const btn = document.getElementById("of-button");
      btn.href = OF_LINK;

      // Zusätzlicher Click-Handler für bessere Chance, Safari zu öffnen
      btn.addEventListener("click", function (e) {
        // Mehrere Methoden versuchen, aus dem Instagram-Browser auszubrechen
        try {
          // Methode 1: window.open
          const win = window.open(OF_LINK, "_blank");
          if (win) {
            e.preventDefault();
            return;
          }
        } catch (err) {}

        try {
          // Methode 2: programmatischer <a>-Click
          const a = document.createElement("a");
          a.href = OF_LINK;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.style.display = "none";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } catch (err) {}

        // Methode 3: Fallback – normales Navigieren (bleibt oft im Instagram-Browser)
        // Der eigentliche <a>-Tag macht das bereits
      });
    }

    function onError() {
      const status = document.getElementById("status");
      status.textContent = "Something went wrong. Please try again.";
      status.className = "status error";
    }
  </script>
</body>
</html>
