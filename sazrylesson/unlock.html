<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Sazry – Unlock</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://challenges.cloudflare.com" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    :root {
      --bg: #120e14;
      --card: #1f1724;
      --text: #fff5f8;
      --muted: #c9a8b8;
      --accent: #ff6b9d;
      --border: rgba(255,150,180,.18);
    }
    * { margin:0; padding:0; box-sizing:border-box }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at 20% 0%, rgba(255,107,157,.12), transparent 50%),
                  radial-gradient(ellipse at 80% 100%, rgba(255,140,180,.08), transparent 45%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 26px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    .emoji { font-size: 2.3rem; margin-bottom: 10px }
    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(120deg, #fff 30%, #ffb6c9 70%, #ff8fb3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      color: var(--muted);
      font-size: .95rem;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .turnstile-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
      min-height: 65px;
    }
    .status {
      font-size: .9rem;
      color: var(--muted);
      min-height: 20px;
      margin-bottom: 6px;
    }
    .status.success { color: #7dffb3 }
    .status.error { color: #ff6b9d }
    .back {
      display: inline-block;
      margin-top: 14px;
      font-size: .85rem;
      color: var(--muted);
      text-decoration: none;
      opacity: .7;
    }
    #success-view { display: none }
    .check { font-size: 2.5rem; margin-bottom: 8px }
    .verified {
      color: #7dffb3;
      font-size: .95rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .redirect-msg {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 18px;
    }
    .of-btn {
      display: block;
      width: 100%;
      padding: 15px 18px;
      border-radius: 999px;
      background: linear-gradient(145deg, #ff8fb3, #ff4d88);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 6px 22px rgba(255,107,157,.4);
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="check-view">
      <div class="emoji">🩵</div>
      <h1>Just a quick check</h1>
      <p>Confirm you’re human to unlock more of me ;)</p>
      <div class="turnstile-wrap">
        <div class="cf-turnstile"
             data-sitekey="0x4AAAAAAFRZvqCEHYEtL8Lf"
             data-callback="onSuccess"
             data-error-callback="onError"
             data-theme="dark"
             data-size="normal"></div>
      </div>
      <div class="status" id="status"></div>
      <a href="index.html" class="back">← back</a>
    </div>

    <div id="success-view">
      <div class="check">✅</div>
      <h1>You're in!</h1>
      <div class="verified">Verified ✓</div>
      <p class="redirect-msg">Opening OnlyFans…</p>
      <a href="#" id="of-btn" class="of-btn">Continue to OnlyFans 🔥</a>
      <a href="index.html" class="back">← back</a>
    </div>
  </div>

  <script>
    var OF_LINK = "https://onlyfans.com/sazera/trial/8jedc0hkze6ed3s4vs87egn1jv6mdag6";

    function openOF() {
      if (/Instagram/i.test(navigator.userAgent)) {
        window.location.href = "instagram://extbrowser/?url=" + encodeURIComponent(OF_LINK);
        setTimeout(function () {
          window.location.href = OF_LINK;
        }, 700);
      } else {
        window.location.href = OF_LINK;
      }
    }

    function onSuccess(token) {
      document.getElementById("check-view").style.display = "none";
      document.getElementById("success-view").style.display = "block";
      openOF();
      var btn = document.getElementById("of-btn");
      btn.onclick = function (e) {
        e.preventDefault();
        openOF();
      };
    }

    function onError() {
      var s = document.getElementById("status");
      s.textContent = "Something went wrong. Please try again.";
      s.className = "status error";
    }
  </script>
</body>
</html>
