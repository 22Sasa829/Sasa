<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sarysaz</title>
  <meta name="description" content="Sarysaz – More of me" />
  <style>
    :root {
      --bg: #120e14;
      --card: #1f1724;
      --text: #fff5f8;
      --muted: #c9a8b8;
      --accent: #ff6b9d;
      --accent-soft: #ff8fb3;
      --border: rgba(255,150,180,.18);
      --radius: 22px;
      --max: 420px;
    }
    * { margin:0; padding:0; box-sizing:border-box }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at 20% 0%, rgba(255,107,157,.12), transparent 50%),
                  radial-gradient(ellipse at 80% 100%, rgba(255,140,180,.08), transparent 45%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px 60px;
      line-height: 1.5;
    }
    .container {
      width: 100%;
      max-width: var(--max);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .profile-pic {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid transparent;
      background: linear-gradient(var(--card), var(--card)) padding-box,
                  linear-gradient(135deg, #ff8fb3, #ff6b9d, #ffb6c9) border-box;
      box-shadow: 0 8px 28px rgba(255,100,150,.22);
    }
    .name {
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(120deg, #fff 30%, #ffb6c9 70%, #ff8fb3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .bio {
      color: var(--muted);
      font-size: 1rem;
      text-align: center;
      margin-top: -8px;
      font-weight: 500;
    }
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 15px 20px;
      border-radius: 999px;
      background: linear-gradient(145deg, #2a1f2e, #1f1724);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(255,100,150,.1);
      transition: transform .2s, background .2s, box-shadow .2s;
    }
    .btn:hover, .btn:active {
      background: linear-gradient(145deg, var(--accent-soft), var(--accent));
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255,107,157,.35);
      color: #fff;
    }
    .more-card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0,0,0,.28);
      transition: transform .2s, box-shadow .2s;
    }
    .more-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 36px rgba(255,100,150,.2);
    }
    .more-card a { display: block; text-decoration: none; color: inherit }
    .more-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
    }
    .more-card .caption {
      padding: 16px 18px;
      text-align: center;
      font-weight: 600;
      font-size: 1.05rem;
    }
    .more-card .caption span {
      display: block;
      font-size: .85rem;
      font-weight: 400;
      color: var(--muted);
      margin-top: 3px;
    }
    footer {
      margin-top: 8px;
      font-size: .78rem;
      color: var(--muted);
      opacity: .65;
      text-align: center;
    }
    @media (max-width: 480px) {
      .profile-pic { width: 120px; height: 120px }
      .more-card img { height: 260px }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="images/profile.jpg" alt="Sarysaz" class="profile-pic" width="140" height="140" />
    <h1 class="name">Sarysaz 💕</h1>
    <p class="bio">You found me 🫣</p>

    <div class="links">
      <a href="https://instagram.com/sarysazbery" class="btn" target="_blank" rel="noopener">Instagram ✨</a>
    </div>

    <div class="more-card">
      <a href="unlock.html">
        <img src="images/more-of-me.jpg" alt="More of me" width="420" height="300" />
        <div class="caption">
          More of me ;)🩵
          <span>Tap to unlock →</span>
        </div>
      </a>
    </div>

    <div class="links">
      <a href="https://twitter.com" class="btn" target="_blank" rel="noopener">Twitter</a>
    </div>

    <footer>© 2026 Sarysaz</footer>
  </div>
</body>
</html>
