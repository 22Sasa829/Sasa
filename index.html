<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sazy</title>
  <meta name="description" content="Sazy – More of me" />

  <!-- ============================================================
       EINSTELLUNGEN – hier kannst du fast alles anpassen
       ============================================================ -->
  <style>
    :root {
      /* Soft girly palette */
      --bg: #120e14;
      --card: #1f1724;
      --text: #fff5f8;
      --muted: #c9a8b8;
      --accent: #ff6b9d;
      --accent-soft: #ff8fb3;
      --accent-hover: #ff4d88;
      --border: rgba(255, 150, 180, 0.18);
      --shine: rgba(255, 255, 255, 0.35);

      --font: "Inter", system-ui, -apple-system, sans-serif;
      --radius: 22px;
      --max-width: 420px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      background: 
        radial-gradient(ellipse at 20% 0%, rgba(255, 107, 157, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(255, 140, 180, 0.08) 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px 60px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
    }

    /* ---- Profilbild ---- */
    .profile-pic {
      width: 148px;
      height: 148px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid transparent;
      background: linear-gradient(var(--card), var(--card)) padding-box,
                  linear-gradient(135deg, #ff8fb3, #ff6b9d, #ffb6c9) border-box;
      box-shadow: 
        0 0 0 4px rgba(255, 107, 157, 0.15),
        0 12px 36px rgba(255, 100, 150, 0.25);
    }

    /* ---- Name & Bio ---- */
    .name {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: center;
      background: linear-gradient(120deg, #fff 30%, #ffb6c9 70%, #ff8fb3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .bio {
      color: var(--muted);
      font-size: 1rem;
      text-align: center;
      max-width: 320px;
      margin-top: -10px;
      font-weight: 500;
    }

    /* ---- Buttons / Links + Shine ---- */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 22px;
      border-radius: 999px;
      background: linear-gradient(145deg, #2a1f2e, #1f1724);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      overflow: hidden;
      transition: all 0.25s ease;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(255, 100, 150, 0.12);
    }

    /* Mini shine effect */
    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        var(--shine),
        transparent
      );
      transform: skewX(-20deg);
      transition: left 0.55s ease;
      pointer-events: none;
    }

    .btn:hover::before {
      left: 130%;
    }

    .btn:hover {
      background: linear-gradient(145deg, var(--accent-soft), var(--accent));
      border-color: transparent;
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(255, 107, 157, 0.4);
      color: #fff;
    }

    /* ---- More of me Karte ---- */
    .more-card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 8px 28px rgba(0,0,0,0.3);
    }

    .more-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 44px rgba(255, 100, 150, 0.22);
      border-color: rgba(255, 150, 180, 0.35);
    }

    .more-card a {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .more-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }

    .more-card .caption {
      padding: 18px 20px;
      text-align: center;
      font-weight: 600;
      font-size: 1.08rem;
      background: linear-gradient(180deg, transparent, rgba(255, 107, 157, 0.06));
    }

    .more-card .caption span {
      display: block;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ---- Footer ---- */
    footer {
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      opacity: 0.7;
    }

    /* Mobile */
    @media (max-width: 480px) {
      .profile-pic {
        width: 128px;
        height: 128px;
      }
      .more-card img {
        height: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- ========================
         PROFILBILD (Image 1)
         ======================== -->
    <img
      src="images/profile.jpg"
      alt="Sazy"
      class="profile-pic"
    />

    <!-- Name & kurze Bio – hier ändern -->
    <h1 class="name">Sazy 💕</h1>
    <p class="bio">You found me 🫣</p>

    <!-- ========================
         LINKS / BUTTONS
         ======================== -->
    <div class="links">
      <a
        href="https://instagram.com/sarysazbery"
        class="btn"
        target="_blank"
        rel="noopener"
      >
        Instagram ✨
      </a>
    </div>

    <!-- ========================
         MORE OF ME (Image 2)
         ======================== -->
    <div class="more-card">
      <a
        href="https://onlyfans.com/sazera/trial/ojmccj0sxdscd84nbs4ynwidzlxslwfz"
        target="_blank"
        rel="noopener"
      >
        <img
          src="images/more-of-me.jpg"
          alt="More of me"
        />
        <div class="caption">
          More of me ;)🩵
          <span>Tap to unlock →</span>
        </div>
      </a>
    </div>

    <footer>
      © 2026 Sazy
    </footer>
  </div>
</body>
</html>
