<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Sarybery – Unlock</title>
  <meta name="robots" content="noindex, nofollow" />

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    :root {
      --bg: #120e14;
      --card: #1f1724;
      --text: #fff5f8;
      --muted: #c9a8b8;
      --accent: #ff6b9d;
      --border: rgba(255, 150, 180, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(255, 107, 157, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(255, 140, 180, 0.08) 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
    }

    .emoji { font-size: 2.4rem; margin-bottom: 12px; }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(120deg, #fff 30%, #ffb6c9 70%, #ff8fb3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .turnstile-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
      min-height: 65px;
    }

    .status {
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 22px;
      margin-bottom: 8px;
    }
    .status.success { color: #7dffb3; }
    .status.error { color: #ff6b9d; }

    .back {
      display: inline-block;
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
      opacity: 0.7;
    }

    #success-view { display: none; }

    .check { font-size: 2.6rem; margin-bottom: 10px; }

    .verified {
      color: #7dffb3;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .of-btn {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 999px;
      background: linear-gradient(145deg, #ff8fb3, #ff4d88);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 8px 24px rgba(255, 107, 157, 0.45);
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .hint {
      margin-top: 18px;
      padding: 12px 14px;
      background: rgba(255, 107, 157, 0.1);
      border: 1px solid rgba(255, 150, 180, 0.3);
      border-radius: 14px;
      font-size: 0.85rem;
      color: #ffd0e0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">

    <div id="check-view">
      <div class="emoji">🩵</div>
      <h1>Just a quick check</h1>
      <p>Confirm you’re human to unlock more of me ;)</p>

      <div class="turnstile-wrap">
        <div
          class="cf-turnstile"
          data-sitekey="0x4AAAAAAFRZvqCEHYEtL8Lf"
          data-callback="onSuccess"
          data-error-callback="onError"
          data-theme="dark"
          data-size="normal"
        ></div>
      </div>

      <div class="status" id="status"></div>
      <a href="index.html" class="back">← back</a>
    </div>

    <div id="success-view">
      <div class="check">✅</div>
      <h1>You're in!</h1>
      <div class="verified">Verified ✓</div>

      <a href="#" id="of-btn" class="of-btn">Continue to OnlyFans 🔥</a>

      <div class="hint">
        Tap the button.<br>
        Instagram will ask if you want to open it in Safari.
      </div>

      <a href="index.html" class="back">← back</a>
    </div>

  </div>

  <script>
    var OF_LINK = "https://onlyfans.com/sazera/trial/ojmccj0sxdscd84nbs4ynwidzlxslwfz";

    function onSuccess(token) {
      document.getElementById("check-view").style.display = "none";
      document.getElementById("success-view").style.display = "block";

      var btn = document.getElementById("of-btn");
      btn.onclick = function(e) {
        e.preventDefault();

        if (/Instagram/i.test(navigator.userAgent)) {
          window.location.href = "instagram://extbrowser/?url=" + encodeURIComponent(OF_LINK);
          setTimeout(function() {
            window.location.href = OF_LINK;
          }, 900);
        } else {
          window.location.href = OF_LINK;
        }
      };
    }

    function onError() {
      var status = document.getElementById("status");
      status.textContent = "Something went wrong. Please try again.";
      status.className = "status error";
    }
  </script>
</body>
</html>
